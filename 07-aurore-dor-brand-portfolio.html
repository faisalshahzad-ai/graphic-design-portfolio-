<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>07 - Aurore D'Or Brand Portfolio</title>
  <style>
    :root { --bg:#120f0d; --ink:#f5f2eb; --gold:#d4af37; --muted:#a89f91; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink);
      font-family: Georgia, "Times New Roman", serif; padding: 24px;
    }
    main { text-align: center; max-width: 720px; }
    .num { font-size: clamp(96px, 22vw, 200px); line-height: 1; color: var(--gold); letter-spacing: .04em; margin: 0; }
    h1 { font-size: clamp(24px, 5vw, 40px); font-weight: 400; letter-spacing: .08em; margin: 12px 0 8px; }
    p { color: var(--muted); font-size: 16px; margin: 0; }
    .rule { width: 64px; height: 1px; background: var(--gold); margin: 24px auto; }
  </style>
</head>
<body>
  <main>
    <p class="num">07</p>
    <div class="rule"></div>
    <h1>Aurore D'Or Brand Portfolio</h1>
    <p>Luxury Brand Identity &amp; Packaging Portfolio</p>
  </main>
</body>
</html>
